{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow rounded-4 p-4">
                <h2 class="fw-bold mb-3">Đăng nhập</h2>
                <p class="text-muted mb-4">Đăng nhập vào hệ thống để quản lý phòng và hóa đơn tiện ích của bạn.</p>
                
                {% if success_message %}
                <div class="alert alert-success" role="alert">{{ success_message }}</div>
                {% endif %}
                {% if message %}
                <div class="alert alert-danger" role="alert">{{ message }}</div>
                {% endif %}
                
                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control rounded-3" id="email" name="email" placeholder="Nhập địa chỉ email" value="{{ request.form.email or '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Mật khẩu</label>
                        <input type="password" class="form-control rounded-3" id="password" name="password" placeholder="Nhập mật khẩu" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill mb-3">Đăng nhập</button>
                </form>
                <div class="text-center">
                    <p class="mb-2">Chưa có tài khoản? <a href="{{ url_for('register') }}" class="text-decoration-none fw-bold">Đăng ký ngay</a></p>
                    <a href="{{ url_for('index') }}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left me-1"></i>Quay lại trang chủ</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
